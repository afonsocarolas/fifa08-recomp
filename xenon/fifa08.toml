# XenonRecomp config for FIFA 08 (second-opinion recompilation; see README).
# Generated code goes to xenon/ppc (not committed).

[main]
file_path = "../game/assets/default.xex"
out_directory_path = "ppc"
switch_table_file_path = "fifa08_switch_tables.toml"   # from XenonAnalyse

# Same settings as ReXGlue's build: no optimizations.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers (addresses from ReXGlue's analysis).
savegprlr_14_address = 0x82421C70
